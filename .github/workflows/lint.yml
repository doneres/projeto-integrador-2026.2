name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    env:
      # Postgres dos testes de integração da API (o service abaixo).
      DATABASE_URL: postgres://axis:axis@localhost:5432/axis
    services:
      postgres:
        # Mesma imagem do compose.yaml; mantenha as duas fixadas na mesma versão.
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: axis
          POSTGRES_PASSWORD: axis
          POSTGRES_DB: axis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axis -d axis"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instala o pnpm (versão do campo packageManager)
        uses: pnpm/action-setup@v4

      - name: Instala o Node.js (versão do .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Lint e formatação (Biome)
        run: pnpm exec biome ci .

      - name: Checagem de tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build
