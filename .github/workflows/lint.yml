name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instala o pnpm (versão do campo packageManager)
        uses: pnpm/action-setup@v4

      - name: Instala o Node.js (versão do .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Lint e formatação (Biome)
        run: pnpm exec biome ci .

      - name: Checagem de tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build
